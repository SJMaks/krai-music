backend:
  name: git-gateway
  branch: main

media_folder: public/images
public_folder: /images

collections:
  - name: artists
    label: Исполнители
    folder: "content/artists"
    create: true
    fields:
      - { label: ID, name: id, hidden: true, default: "{{now}}"}
      - { label: Никнейм, name: nickname, widget: string }
      - { label: Фото 4/5, name: verticalImage, widget: image }
      - { label: Биография, name: biography, widget: text }
      - { label: Фото 1/1, name: squareImage, widget: image }
      - { label: Ссылки на соц. сети, name: socials, widget: list, fields: [{ label: Соц. сеть, name: label, widget: string }, { label: Ссылка, name: url, widget: string }] }
      - { label: Видео, name: videos, widget: list, fields: [{ label: Название, name: title, widget: string }, { label: Описание, name: description, widget: text }, { label: Ссылка, name: url, widget: string }, { label: Обложка, name: cover, widget: image }] }
      - label: Выделенный трек
        name: featuredTrack
        widget: relation
        collection: tracks
        search_fields: [title]
        value_field: id
        display_fields: [title, authors.nickname]
        multiple: true

  - name: tracks
    label: Треки
    folder: "content/tracks"
    create: true
    fields:
      - { label: ID, name: id, hidden: true, default: "{{now}}"}
      - { label: Название, name: title, widget: string }
      - label: Авторы
        name: authors
        widget: relation
        collection: artists
        search_fields: [nickname]
        value_field: id
        display_fields: [nickname]
        multiple: true
      - { label: Обложка, name: cover, widget: image }
      - { label: Аудио, name: audio, widget: file }
      - { label: Дата релиза, name: releaseDate, widget: datetime }
      - { label: Тип релиза, name: releaseType, widget: string }
      - { label: Описание, name: description, widget: string }

  - name: events
    label: Мероприятия
    folder: "content/events"
    create: true
    fields:
      - { label: ID, name: id, hidden: true, default: "{{now}}" }
      - { label: Название, name: title, widget: string }
      - { label: Описание, name: description, widget: text }
      - { label: Изображение, name: image, widget: image }
      - { label: Дата, name: date, widget: datetime }
      - { label: Место, name: location, widget: string }
      - { label: Ссылки, name: links, widget: list, fields: [{ label: Название, name: label, widget: string }, { label: Ссылка, name: url, widget: string }] }

  - name: homepage
    label: Содержимое страниц
    files:
      - name: homepage
        label: Главная страница
        file: content/homepage.json
        format: json
        fields:
          - { label: Заголовок, name: heroTitle, widget: string }
          - { label: Подзаголовок, name: heroSubtitle, widget: text }
          - label: Выделенные исполнители
            name: featuredArtists
            widget: relation
            collection: artists
            search_fields: [nickname]
            value_field: id
            display_fields: [nickname]
            multiple: true
          - label: Выделенные треки
            name: featuredTracks
            widget: relation
            collection: tracks
            search_fields: [title]
            value_field: id
            display_fields: [title]
            multiple: true
          - label: Выделенные мероприятия
            name: featuredEvents
            widget: relation
            collection: events
            search_fields: [title]
            value_field: id
            display_fields: [title]
            multiple: true